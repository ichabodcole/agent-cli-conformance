# The gate, run where it cannot be skipped.
#
# The Husky pre-commit hook runs `bun run check` too, and it is the faster feedback — but a local
# hook is bypassable with `--no-verify` and only ever sees the machine it ran on. The README says
# violations "fail CI"; this workflow is what makes that sentence true rather than aspirational.
#
# It runs `bun run check` and nothing else, deliberately. Splitting the gate into parallel jobs
# would make this file a second declaration of what "checked" means, and two declarations of one
# thing drift — which is the failure this whole project exists to catch.
name: check

on:
  # `branches` rather than a bare `push:` so a tag push does not run the gate a second time on a
  # commit it has already passed on. release-please tags every release, so the bare form doubled
  # every release's CI.
  push:
    branches:
      - "**"
  pull_request:

# A superseded run reports on code nobody has any more. (A PR branch is built twice — once for
# the push, once for the PR — which is the price of covering both direct pushes and forks.)
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version this repo develops against. Floating on `latest` lets a runtime
          # release turn the gate red with no commit behind it, which trains people to ignore it.
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
